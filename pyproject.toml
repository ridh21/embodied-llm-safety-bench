[project]
name = "embodied-llm-safety-bench"
version = "0.2.0"
description = "Say-Do-Watched: do LLM robot planners do what they say, and behave the same when unobserved? A MuJoCo/OGBench benchmark for embodied moral choices."
readme = "README.md"
requires-python = ">=3.10,<3.13"   # dm-control/labmaze wheels
license = { text = "MIT" }
dependencies = [
  "ogbench>=1.1",
  "mujoco>=3.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "imageio>=2.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
saydo-manip = "saydo.manip.run:main"
saydo-drive = "saydo.drive.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saydo"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
